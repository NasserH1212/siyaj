[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "siyaj-core"
version = "0.1.0"
description = "Siyaj core gateway (FastAPI modular monolith)"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi==0.162.4",
    "pydantic==2.14.3",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
include = ["siyaj*"]

[tool.setuptools.package-data]
siyaj = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "BLE", "RUF", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting relies on bare asserts.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["siyaj", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
